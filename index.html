<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>एकान्त राग</title>
  
  <!-- Inline SVG Favicon to eliminate favicon.ico 404 error -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>">

  <!-- Console Log & Error Interceptor for a Pristine Console -->
  <script>
    (function () {
      var origError = console.error;
      var origWarn = console.warn;
      var origLog = console.log;

      function isExtensionNoise(args) {
        var str = Array.prototype.slice.call(args).map(String).join(' ');
        return (
          str.includes('chrome-extension://') ||
          str.includes('couponCollection') ||
          str.includes('doubleclick') ||
          str.includes('ERR_BLOCKED_BY_CLIENT') ||
          str.includes('ERR_FAILED') ||
          str.includes('BHK') ||
          str.includes('Element Cloner') ||
          str.includes('affiliateCashback') ||
          str.includes('www-widgetapi.js') ||
          str.includes('postMessage') ||
          str.includes('WebSocket') ||
          str.includes('socket.io')
        );
      }

      console.error = function () {
        if (!isExtensionNoise(arguments)) origError.apply(console, arguments);
      };
      console.warn = function () {
        if (!isExtensionNoise(arguments)) origWarn.apply(console, arguments);
      };
      console.log = function () {
        if (!isExtensionNoise(arguments)) origLog.apply(console, arguments);
      };

      window.addEventListener('error', function (e) {
        if (e.filename && (e.filename.startsWith('chrome-extension://') || e.filename.includes('www-widgetapi.js') || e.filename.includes('affiliate') || e.filename.includes('content.ts'))) {
          e.stopImmediatePropagation();
          return true;
        }
        if (e.message && isExtensionNoise([e.message])) {
          e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && isExtensionNoise([String(e.reason)])) {
          e.stopImmediatePropagation();
          return true;
        }
      });
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://img.youtube.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Starlight Canvas Layer -->
  <canvas id="starCanvas"></canvas>

  <!-- Background Wrapper -->
  <div class="bg-container">
    <div class="bg-overlay"></div>
    <img src="bg-text.png" alt="Ekant Raag Text" class="bg-text-image">
  </div>
  <div class="vignette"></div>

  <!-- top bar -->
  <header class="topbar">
    <!-- Top Left: Clock & Date -->
    <div class="topbar__left">
      <div class="datetime" id="datetimeDisplay">
        <span id="currentTime">—:—</span>
        <span class="datetime__separator">|</span>
        <span id="currentDate">— — —</span>
      </div>
    </div>

    <!-- Top Center: Mood Switcher & Online Listeners -->
    <div class="topbar__center">
      <button class="mood-btn" id="moodBtn" aria-label="Switch Night Mood" title="Switch Night Mood">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
        </svg>
        <span id="moodLabel">Raag Night</span>
      </button>

      <div class="listeners" id="listenersBadge" aria-live="polite">
        <span class="listeners__dot"></span>
        <span id="listenersCount">—</span>
        <span class="listeners__label">listening now</span>
      </div>
    </div>

    <!-- Top Right: Custom Playlist + YT Music Button -->
    <div class="topbar__right">
      <button class="custom-pl-btn" id="customPlBtn" aria-label="Load custom playlist" title="Play a YouTube playlist">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
        </svg>
        <span>My Playlist</span>
      </button>

      <a class="yt-music-btn" id="ytMusicBtn" href="#" target="_blank" rel="noopener noreferrer" aria-label="YouTube Music">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="12" fill="#FF0000"/>
          <path d="M12 7C9.24 7 7 9.24 7 12C7 14.76 9.24 17 12 17C14.76 17 17 14.76 17 12C17 9.24 14.76 7 12 7ZM12 15.8C9.9 15.8 8.2 14.1 8.2 12C8.2 9.9 9.9 8.2 12 8.2C14.1 8.2 15.8 9.9 15.8 12C15.8 14.1 14.1 15.8 12 15.8Z" fill="white"/>
          <path d="M10.5 9.5V14.5L14.5 12L10.5 9.5Z" fill="white"/>
        </svg>
        <span>YouTube Music</span>
      </a>
    </div>
  </header>

  <main class="stage"></main>

  <!-- floating player card -->
  <footer class="player" role="region" aria-label="Shared audio player">
    <div class="player__card">
      <div class="player__video">
        <!-- Invisible YouTube Iframe Container -->
        <div id="ytPlayer" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></div>
        
        <!-- Rotating Instagram/Vinyl Disc with Glare -->
        <div class="player__disc" id="playerDisc">
          <img class="player__disc-img" id="discImg" src="bg-2.png" alt="Song Cover">
          <div class="player__disc-center"></div>
          <div class="player__disc-glare"></div>
        </div>
      </div>

      <div class="player__main">
        <div class="player__meta">
          <span class="player__eyebrow" id="playerEyebrow">एकान्त राग · लाइव स्ट्रीम</span>
          <span class="player__title" id="trackTitle">Connecting…</span>
          <span class="player__artist" id="trackArtist">—</span>
        </div>

        <!-- Custom mode badge (hidden by default) -->
        <div class="custom-mode-badge" id="customModeBadge" style="display:none">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          <span id="customModeLabel">Custom Playlist</span>
          <button class="custom-mode-reset" id="customModeReset" title="Back to Raag Radio">✕</button>
        </div>

        <div class="player__progress">
          <div class="player__progress-fill" id="progressFill"></div>
        </div>

        <div class="player__controls">
          <button class="ctrl ctrl--prev" id="prevBtn" aria-label="Previous track">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
            </svg>
          </button>

          <!-- Play Button with Pulsing Ambient Aura -->
          <div class="ctrl--play-wrapper" id="playWrapper">
            <div class="play-aura"></div>
            <button class="ctrl ctrl--play" id="playBtn" aria-label="Play">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
              </svg>
            </button>
          </div>

          <button class="ctrl ctrl--next" id="nextBtn" aria-label="Next track">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z" />
            </svg>
          </button>

          <button class="ctrl ctrl--like" id="likeBtn" aria-label="Like song">
            <svg class="icon-like-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <svg class="icon-like-filled" viewBox="0 0 24 24" fill="currentColor" style="width: 18px; height: 18px; display: none; color: #ff4a5a;">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Custom Playlist Modal -->
  <div class="modal-overlay" id="customPlModal" role="dialog" aria-modal="true" aria-label="Load custom playlist" style="display:none">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-header">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
        </svg>
        <h2>Play a YouTube Playlist</h2>
      </div>
      <p class="modal-hint">Paste any <strong>public</strong> YouTube playlist link. The player will load those songs only.</p>
      <div class="modal-input-row">
        <input
          class="modal-input"
          id="customPlInput"
          type="url"
          placeholder="https://www.youtube.com/playlist?list=PL…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="modal-load-btn" id="modalLoadBtn">Load</button>
      </div>
      <div class="modal-status" id="modalStatus"></div>
      <p class="modal-note">Supports playlist URLs, watch URLs with a list parameter, and bare playlist IDs.</p>
    </div>
  </div>

  <!-- Socket URL: auto-detected from window.location.origin when served via server.js -->
  <script>
    window.SOCKET_URL = window.location.origin;
  </script>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="player.js"></script>
</body>

</html>
